<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Mailbox</title>
<style>
  :root {
    --bg: #F5F7F6; --card: #FFFFFF; --sunk: #EEF2F0; --hover: #F2F6F4;
    --ink: #121C1A; --ink-2: #5A6B65; --ink-3: #8B9994;
    --line: #E3E9E6;
    --accent: #0C6E66; --accent-soft: #E4F0EE;
    --live: #1F9D55; --live-rgb: 31,157,85;
    --wait: #C4880A; --idle: #9AA8A3;
    --release: #BE3A32;
    --alarm: #B3323C; --alarm-soft: #FBECED;
    --shadow: 0 1px 2px rgba(18,28,26,.05);
    --shadow-lift: 0 3px 12px rgba(18,28,26,.09);
    --shadow-modal: 0 16px 48px rgba(18,28,26,.22);
    --radius: 14px;
    --ease: cubic-bezier(.2,.8,.3,1);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1211; --card: #141D1C; --sunk: #1B2625; --hover: #1B2625;
      --ink: #E6EDEB; --ink-2: #9FB0AB; --ink-3: #6E807A;
      --line: #232F2E;
      --accent: #5CC8BC; --accent-soft: #10302D;
      --live: #4ECB79; --live-rgb: 78,203,121;
      --wait: #E3AC4B; --idle: #6E807A;
      --release: #D4544A;
      --alarm: #EE8890; --alarm-soft: #2C181A;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      --shadow-lift: 0 3px 14px rgba(0,0,0,.4);
      --shadow-modal: 0 16px 48px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 40rem; margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
    display: flex; flex-direction: column; gap: 1.25rem;
  }

  /* ---------------------------------------------------------------- header */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .bar h1 { margin: 0; font-size: 1.35rem; font-weight: 650; letter-spacing: -0.02em; }
  button.outline {
    font: inherit; font-size: 0.78rem; font-weight: 550; cursor: pointer;
    padding: 0.3rem 0.75rem; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--ink-3);
    transition: color .16s var(--ease), border-color .16s var(--ease), background .16s var(--ease);
  }
  button.outline:hover { color: var(--ink-2); border-color: var(--ink-3); background: var(--card); }

  /* Connection state is shown only when it is bad. A green dot confirming
     normality is noise, and hiding it makes the abnormal case louder. */
  .offline {
    display: flex; align-items: center; gap: 0.55rem;
    border-radius: 10px; padding: 0.55rem 0.85rem;
    background: var(--alarm-soft); color: var(--alarm);
    font-size: 0.85rem; font-weight: 550;
    animation: fadeIn .2s var(--ease);
  }
  .spinner {
    width: 11px; height: 11px; border-radius: 50%; flex: none;
    border: 2px solid currentColor; border-right-color: transparent;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .notice {
    border-radius: var(--radius); padding: 0.8rem 1rem; font-size: 0.9rem;
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    background: var(--alarm-soft); color: var(--alarm);
    animation: fadeIn .25s var(--ease);
  }
  .notice button { background: none; border: none; color: inherit; font-size: 1.15rem; cursor: pointer; padding: 0 0.2rem; border-radius: 6px; }

  /* --------------------------------------------------------------- roster */
  #groups { display: flex; flex-direction: column; gap: 0.7rem; }

  /* ------------------------------------------------------- free mailbox
     The one state where the next move is obvious and usually wanted, so it
     gets the loudest treatment on the page and the action sits right in it. */
  .free {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 0.95rem;
    padding: 1.05rem 1.1rem;
    border-radius: var(--radius);
    background: linear-gradient(135deg, var(--accent-soft) 0%, var(--card) 85%);
    border: 1.5px solid color-mix(in srgb, var(--accent) 38%, transparent);
    box-shadow: var(--shadow-lift);
    animation: fadeIn .25s var(--ease);
  }
  .free-icon {
    position: relative; flex: none;
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent); color: var(--card);
  }
  .free-icon svg { width: 22px; height: 22px; }
  /* A slow ring radiating outward: "available", noticed from the corner of an eye. */
  .free-icon::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(var(--live-rgb), .5);
    animation: ring 2.2s var(--ease) infinite;
  }
  @keyframes ring {
    0%   { box-shadow: 0 0 0 0 rgba(var(--live-rgb), .5); }
    75%  { box-shadow: 0 0 0 12px rgba(var(--live-rgb), 0); }
    100% { box-shadow: 0 0 0 0 rgba(var(--live-rgb), 0); }
  }
  .free-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0.12rem; }
  .free-title { font-size: 1.02rem; font-weight: 650; letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.45rem; }
  .free-tag {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    padding: 0.08rem 0.38rem; border-radius: 4px;
    background: rgba(var(--live-rgb), .16); color: var(--live);
  }
  .free-hint { font-size: 0.83rem; color: var(--ink-2); line-height: 1.45; }
  button.take {
    flex: none; font: inherit; font-size: 0.9rem; font-weight: 650; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
    padding: 0.62rem 1.2rem; border-radius: 999px; border: none;
    background: var(--accent); color: var(--card);
    box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 35%, transparent);
    transition: transform .12s var(--ease), filter .16s var(--ease), box-shadow .16s var(--ease);
  }
  button.take:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 5px 16px color-mix(in srgb, var(--accent) 42%, transparent); }
  button.take:active { transform: scale(0.96); }
  button.take:disabled { cursor: default; filter: none; transform: none; opacity: 0.8; }
  button.take .spinner { width: 12px; height: 12px; }
  @media (max-width: 30rem) {
    .free { flex-wrap: wrap; }
    button.take { width: 100%; padding: 0.7rem 1rem; }
  }
  .card { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .people { list-style: none; margin: 0; padding: 0; }

  /* Two lines, so a long address and a full-sentence status never compete for
     the same horizontal space. Holds up from a phone to a desktop unchanged. */
  .person {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--line);
    transition: background .16s var(--ease);
    animation: fadeIn .22s var(--ease);
  }
  .person:last-child { border-bottom: none; }
  .person:hover { background: var(--hover); }
  .person.self { background: var(--accent-soft); }
  .person.self:hover { background: var(--accent-soft); filter: brightness(0.985); }
  .person.away { opacity: 0.5; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    color: #fff; font-size: 0.82rem; font-weight: 650;
  }
  .info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0.05rem; }
  .line { display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
  .addr { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9rem; }
  .person.self .addr { font-weight: 600; }
  .badge {
    flex: none; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 0.06rem 0.3rem; border-radius: 4px;
    background: var(--accent); color: var(--card);
  }
  .status { font-size: 0.78rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--idle); }
  .dot.holder { background: var(--live); animation: pulse 2.6s var(--ease) infinite; }
  .dot.queued { background: var(--wait); }
  .dot.hollow { background: none !important; border: 1.5px solid var(--idle); animation: none; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(var(--live-rgb), .45); }
    70%  { box-shadow: 0 0 0 6px rgba(var(--live-rgb), 0); }
    100% { box-shadow: 0 0 0 0 rgba(var(--live-rgb), 0); }
  }
  .clock { flex: none; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.73rem; color: var(--ink-3); }
  .clock.urgent { color: var(--wait); font-weight: 650; }

  button.act {
    flex: none; font: inherit; font-size: 0.78rem; font-weight: 600;
    padding: 0.32rem 0.8rem; border-radius: 999px; cursor: pointer;
    border: none; background: var(--accent); color: var(--card);
    transition: transform .12s var(--ease), filter .16s var(--ease), box-shadow .16s var(--ease);
  }
  button.act:hover { filter: brightness(1.12); box-shadow: var(--shadow-lift); }
  button.act:active { transform: scale(0.95); }
  button.act.release { background: var(--release); color: #fff; }
  button.act.quiet { background: var(--sunk); color: var(--ink-2); }
  button.act.quiet:hover { filter: none; background: var(--line); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ------------------------------------------------------------------ list */
  .section-label {
    font-size: 0.7rem; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 650; padding: 0 0.3rem;
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
  }
  .list { display: flex; flex-direction: column; gap: 0.55rem; }
  .msg {
    background: var(--card); border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow);
    transition: box-shadow .18s var(--ease), transform .18s var(--ease);
  }
  .msg.entering { animation: cardIn .3s var(--ease); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .msg.openable:not(.open):hover { transform: translateY(-1px); box-shadow: var(--shadow-lift); }
  .msg.fresh .subject::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); display: inline-block; margin-right: 0.45rem; vertical-align: 0.08em;
  }
  .msg-head { padding: 0.75rem 0.9rem; display: flex; flex-direction: column; gap: 0.3rem; transition: background .16s var(--ease); }
  .msg.openable .msg-head { cursor: pointer; }
  .msg.openable .msg-head:hover { background: var(--hover); }

  .row1 { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
  .sender { flex: 1 1 12rem; min-width: 0; display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap; }
  .sender-name { font-weight: 600; font-size: 0.89rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .sender-addr { font-size: 0.76rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .when { flex: none; font-size: 0.74rem; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: auto; }
  .subject { font-size: 0.96rem; line-height: 1.35; word-break: break-word; }
  .subject.masked { color: var(--ink-2); }

  /* Three addresses are in play: who sent it, which of our addresses it landed
     on, and which of us it belongs to. Each gets its own line. */
  .meta { display: flex; flex-direction: column; gap: 0.05rem; font-size: 0.75rem; color: var(--ink-3); }
  .meta-line { display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
  .meta-line .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta-line .push { margin-left: auto; }
  .tag { flex: none; padding: 0.06rem 0.36rem; border-radius: 5px; background: var(--sunk); color: var(--ink-2); font-size: 0.68rem; font-weight: 600; }
  .tag.mine { background: var(--accent); color: var(--card); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.62rem; }
  .tag.warn { background: var(--alarm-soft); color: var(--alarm); }

  /* ------------------------------------------------------------------ body */
  .body { border-top: 1px solid var(--line); animation: fadeIn .22s var(--ease); }
  .body-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    padding: 0.45rem 0.65rem; background: var(--sunk); flex-wrap: wrap;
  }
  .exact { font-size: 0.71rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .frame { display: block; width: 100%; height: 26rem; border: 0; background: #fff; }
  @media (prefers-color-scheme: dark) { .frame { background: #141D1C; } }
  .locked {
    position: relative; overflow: hidden;
    padding: 1rem 1.1rem;
    display: flex; flex-direction: column; align-items: flex-start; gap: 0.45rem;
  }
  /* A watermark, so the panel reads as "not a message" before a word of it is.
     Sized and placed to sit clear of the left-aligned text. */
  .locked.marked { min-height: 7.5rem; justify-content: center; }
  .locked-mark {
    position: absolute; right: -0.75rem; top: 50%; transform: translateY(-50%);
    width: 7.5rem; height: 7.5rem;
    color: var(--ink); opacity: 0.07; pointer-events: none;
  }
  .locked-mark svg { display: block; width: 100%; height: 100%; }
  @media (prefers-color-scheme: dark) { .locked-mark { opacity: 0.1; } }
  .locked p { margin: 0; position: relative; max-width: 28rem; }
  .locked-lead { font-size: 0.87rem; color: var(--ink); }
  .locked-hint { font-size: 0.82rem; color: var(--ink-2); line-height: 1.55; }
  /* An empty inbox is the normal resting state, so it should read as a place
     where mail will land, not as a stray caption. */
  .empty {
    min-height: 11rem; padding: 2rem 1.25rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.35rem;
    text-align: center; color: var(--ink-2);
    border: 2px dashed var(--line); border-radius: var(--radius);
    background: color-mix(in srgb, var(--card) 55%, transparent);
  }
  .empty-icon { width: 2.4rem; height: 2.4rem; color: var(--ink-3); margin-bottom: 0.35rem; }
  .empty-icon svg { display: block; width: 100%; height: 100%; }
  .empty-title { font-size: 0.95rem; font-weight: 600; color: var(--ink); }
  .empty-hint { font-size: 0.82rem; color: var(--ink-3); max-width: 22rem; }

  /* ---------------------------------------------------------------- dialog */
  dialog {
    border: none; padding: 0; border-radius: var(--radius);
    background: var(--card); color: var(--ink);
    box-shadow: var(--shadow-modal);
    max-width: min(23rem, calc(100vw - 2rem));
  }
  dialog::backdrop { background: rgba(10,18,17,.42); }
  dialog[open] { animation: popIn .18s var(--ease); }
  @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  .dialog-body { padding: 1.2rem 1.25rem 0; display: flex; flex-direction: column; gap: 0.5rem; }
  .dialog-body h2 { margin: 0; font-size: 1.02rem; font-weight: 650; letter-spacing: -0.01em; }
  .dialog-body p { margin: 0; font-size: 0.86rem; color: var(--ink-2); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 0.5rem; padding: 1.1rem 1.25rem 1.15rem; }
  .dialog-actions button {
    font: inherit; font-size: 0.83rem; font-weight: 600; cursor: pointer;
    padding: 0.4rem 0.9rem; border-radius: 9px; border: none;
    transition: filter .16s var(--ease), background .16s var(--ease);
  }
  .dialog-actions .cancel { background: var(--sunk); color: var(--ink); }
  .dialog-actions .cancel:hover { background: var(--line); }
  .dialog-actions .danger { background: var(--release); color: #fff; }
  .dialog-actions .danger:hover { filter: brightness(1.1); }

  [hidden] { display: none !important; }

  @media (max-width: 30rem) {
    body { font-size: 14.5px; }
    .wrap { padding: 1.1rem 0.75rem 2.5rem; gap: 1rem; }
    .person { padding: 0.55rem 0.7rem; gap: 0.6rem; }
    .msg-head { padding: 0.65rem 0.75rem; }
    .avatar { width: 30px; height: 30px; }
    .frame { height: 20rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <h1>Mailbox</h1>
    <button type="button" class="outline" id="signout">Sign out</button>
  </div>

  <div class="offline" id="offline" hidden><span class="spinner"></span><span>Reconnecting…</span></div>
  <div id="notice"></div>

  <div id="groups"></div>

  <div class="section-label"><span>Messages</span><span id="count"></span></div>
  <div class="list" id="list">
    <div class="empty">
      <span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span>
      <span class="empty-title">No mail yet</span>
      <span class="empty-hint">New messages appear here the moment they arrive.</span>
    </div>
  </div>

</div>

<dialog id="signout-dialog">
  <div class="dialog-body">
    <h2>Sign out of this site?</h2>
    <p>You will need a new one-time PIN to get back in. This does not change who has the mailbox.</p>
  </div>
  <div class="dialog-actions">
    <button type="button" class="cancel" id="signout-cancel">Cancel</button>
    <button type="button" class="danger" id="signout-confirm">Sign out</button>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  var TITLE = 'Mailbox';

  var ws = null, backoff = 500, pinger = null, everConnected = false, removed = false;
  var state = null, skew = 0, connectedAt = Date.now();
  var items = new Map();     // id -> item metadata from the server
  var cards = new Map();     // id -> { node, els, open, content, denied, sent, painted }
  var unread = new Set();
  var notice = null;
  var autoOpened = 0;

  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls) { var n = document.createElement(tag); if (cls) n.className = cls; return n; };
  var serverNow = function () { return Date.now() + skew; };
  var local = function (email) { return String(email || '').split('@')[0]; };

  function hueOf(text) {
    var h = 0;
    for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
    return h % 360;
  }

  function ago(at) {
    var s = Math.max(0, Math.round((serverNow() - at) / 1000));
    if (s < 5) return 'just now';
    if (s < 60) return s + 's ago';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    var d = Math.floor(h / 24);
    if (d < 7) return d + 'd ago';
    return new Date(at).toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function clockText(ms) {
    var left = Math.max(0, ms);
    var m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  // ---------------------------------------------------------------- transport

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws');

    ws.onopen = function () {
      backoff = 500;
      everConnected = true;
      connectedAt = Date.now();
      $('offline').hidden = true;
      send({ t: 'archive' });
      pinger = setInterval(function () { send({ t: 'ping' }); }, 30000);
    };
    ws.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (err) { return; }
      handle(m);
    };
    ws.onclose = function () {
      ws = null;
      clearInterval(pinger);
      if (removed) return;
      if (everConnected) $('offline').hidden = false;
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 10000);
    };
    ws.onerror = function () { try { ws.close(); } catch (err) {} };
  }

  function send(payload) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
  }

  function handle(m) {
    switch (m.t) {
      case 'pong': return;

      case 'state': {
        skew = m.now - Date.now();
        taking = false;
        var firstState = !state;
        state = m;
        paintPeople();
        // "received by you" depends on knowing who you are, so the very first
        // state frame has to repaint any cards that arrived before it.
        if (firstState) items.forEach(function (item) { syncCard(item, false); });
        // What an unreadable message advises depends on your current role.
        cards.forEach(function (card, id) {
          var it = items.get(id);
          if (card.open && it && !it.readable) paintLocked(card, it);
        });
        return;
      }

      case 'mail': {
        var known = items.has(m.item.id);
        items.set(m.item.id, m.item);
        syncCard(m.item, !known);
        if (known && !m.item.readable) {
          var lockedCard = cards.get(m.item.id);
          if (lockedCard) { forgetBody(lockedCard); paintBody(m.item.id); }
        }
        if (!known) {
          if (document.hidden) unread.add(m.item.id);
          if (m.item.mine && m.item.id > autoOpened) { autoOpened = m.item.id; openCard(m.item.id); }
        }
        paintCount();
        paintTitle();
        return;
      }

      case 'archive':
        // Newest-first from the server, and every card prepends — so replay it
        // oldest-first to land in the right order.
        m.items.slice().reverse().forEach(function (item) {
          var known = items.has(item.id);
          items.set(item.id, item);
          syncCard(item, !known);
        });
        paintCount();
        return;

      case 'body': {
        var card = cards.get(m.id);
        if (!card) return;
        card.denied = !!m.denied;
        card.content = m.denied ? null : { html: m.html || '' };
        paintBody(m.id);
        return;
      }

      case 'evict':
        showNotice('Your time ran out — someone else was waiting. Request again to rejoin the queue.');
        return;

      case 'bye':
        if (m.reason === 'revoked') {
          removed = true;
          showNotice('Your access to this mailbox has been removed.');
          return;
        }
        showNotice('Session expired. Reloading…');
        setTimeout(function () { location.reload(); }, 1500);
        return;
    }
  }

  function showNotice(text) { notice = text; paintNotice(); }

  function paintNotice() {
    var host = $('notice');
    host.textContent = '';
    if (!notice) return;
    var box = el('div', 'notice');
    var span = el('span'); span.textContent = notice;
    var x = el('button'); x.type = 'button'; x.setAttribute('aria-label', 'Dismiss');
    x.textContent = '×';
    x.onclick = function () { notice = null; paintNotice(); };
    box.appendChild(span); box.appendChild(x);
    host.appendChild(box);
  }

  // ---------------------------------------------------------------- presence

  var ACTION = { holder: 'Release', queued: 'Exit', idle: 'Request' };

  // Eye-with-a-slash: "you cannot see this", read before any text is.
  var EYE_OFF =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"'
    + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>'
    + '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>'
    + '<path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>'
    + '<line x1="1" y1="1" x2="23" y2="23"/>'
    + '</svg>';

  /**
   * The address is the subject of the sentence, so a row reads straight
   * through: "alice@example.com / is using the mailbox".
   */
  function statusLabel(person, isSelf) {
    var lead = isSelf ? 'You are ' : 'Is ';
    if (!person.online) return lead + 'away';
    if (person.role === 'holder') return lead + 'using the mailbox';
    if (person.role === 'queued') {
      return lead + (person.position === 1 ? 'next in line' : '#' + person.position + ' in line');
    }
    return lead + 'not in line';
  }

  function personRow(person) {
    var mine = person.email === state.you.email;
    var li = el('li', 'person' + (mine ? ' self' : '') + (person.online ? '' : ' away'));

    var avatar = el('span', 'avatar');
    avatar.style.background = 'hsl(' + hueOf(person.email) + ' 42% 42%)';
    avatar.textContent = (local(person.email)[0] || '?').toUpperCase();

    var info = el('div', 'info');

    var top = el('div', 'line');
    var addr = el('span', 'addr');
    addr.textContent = person.email;
    top.appendChild(addr);
    if (mine) { var badge = el('span', 'badge'); badge.textContent = 'me'; top.appendChild(badge); }

    var bottom = el('div', 'line');
    bottom.appendChild(el('i', 'dot ' + person.role + (person.online ? '' : ' hollow')));
    var label = el('span', 'status');
    label.textContent = statusLabel(person, mine);
    bottom.appendChild(label);

    // Only rendered while a clock is actually running.
    if (person.role === 'holder' && state.deadline) {
      var clock = el('span', 'clock');
      clock.id = 'deadline-clock';
      bottom.appendChild(clock);
    }

    info.appendChild(top); info.appendChild(bottom);
    li.appendChild(avatar); li.appendChild(info);

    if (mine) {
      var act = el('button', 'act' + (person.role === 'holder' ? ' release' : person.role === 'queued' ? ' quiet' : ''));
      act.type = 'button';
      act.textContent = ACTION[person.role];
      act.onclick = function () {
        notice = null; paintNotice();
        send({ t: person.role === 'idle' ? 'request' : 'release' });
      };
      li.appendChild(act);
    }
    return li;
  }

  // Inbox with a downward arrow: "mail comes to you".
  var INBOX_IN =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
    + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M12 3v9"/><path d="m8.5 8.5 3.5 3.5 3.5-3.5"/>'
    + '<path d="M3 14h4.5l1.5 2.5h6l1.5-2.5H21"/>'
    + '<path d="M3 14v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/>'
    + '</svg>';

  // Set on click, cleared by the next state frame, so a second click in the
  // round trip cannot send a second request.
  var taking = false;

  /** Shown instead of the holder row whenever nobody has the box. */
  function freeCard() {
    var card = el('div', 'free');
    card.setAttribute('role', 'region');
    card.setAttribute('aria-label', 'The mailbox is free');

    var icon = el('span', 'free-icon');
    icon.innerHTML = INBOX_IN;   // constant markup, no interpolation

    var text = el('div', 'free-text');
    var title = el('div', 'free-title');
    title.appendChild(document.createTextNode('The mailbox is free'));
    var tag = el('span', 'free-tag'); tag.textContent = 'available';
    title.appendChild(tag);
    var hint = el('div', 'free-hint');
    hint.textContent = 'Take it now, and every email that arrives while you hold it is yours alone.';
    text.appendChild(title); text.appendChild(hint);

    var button = el('button', 'take');
    button.type = 'button';
    if (taking) {
      button.disabled = true;
      button.appendChild(el('span', 'spinner'));
      button.appendChild(document.createTextNode('Taking…'));
    } else {
      button.textContent = 'Take the mailbox';
    }
    button.onclick = function () {
      if (taking) return;
      taking = true;
      notice = null; paintNotice();
      send({ t: 'request' });
      paintPeople();
    };

    card.appendChild(icon); card.appendChild(text); card.appendChild(button);
    return card;
  }

  function groupCard(people) {
    var card = el('div', 'card');
    var ul = el('ul', 'people');
    people.forEach(function (p) { ul.appendChild(personRow(p)); });
    card.appendChild(ul);
    return card;
  }

  function paintPeople() {
    var host = $('groups');
    host.textContent = '';
    if (!state) return;

    var by = function (role) { return state.people.filter(function (p) { return p.role === role; }); };
    var idle = by('idle');
    // Only the idle are safe to reorder — the other two carry queue order, and
    // sorting those would misreport whose turn is next.
    idle.sort(function (a, b) {
      return (b.email === state.you.email ? 1 : 0) - (a.email === state.you.email ? 1 : 0);
    });

    // Each row says what it is, so group headings would only repeat it. A free
    // mailbox gets its own card with the action in it, because it is the one
    // empty state worth acting on; an empty queue simply vanishes.
    var holders = by('holder');
    if (holders.length) host.appendChild(groupCard(holders));
    else host.appendChild(freeCard());
    if (by('queued').length) host.appendChild(groupCard(by('queued')));
    if (idle.length) host.appendChild(groupCard(idle));

    paintClock();
  }

  function paintClock() {
    var clock = $('deadline-clock');
    if (!clock || !state || !state.deadline) return;
    var left = state.deadline - serverNow();
    clock.textContent = clockText(left);
    clock.className = 'clock' + (left <= 30000 ? ' urgent' : '');
  }

  // ---------------------------------------------------------------- messages

  function buildCard(item) {
    var node = el('article', 'msg');
    node.dataset.id = String(item.id);

    var head = el('div', 'msg-head');
    var row1 = el('div', 'row1');
    var sender = el('div', 'sender');
    var name = el('span', 'sender-name');
    var addr = el('span', 'sender-addr');
    sender.appendChild(name); sender.appendChild(addr);
    var when = el('time', 'when');
    row1.appendChild(sender); row1.appendChild(when);

    var subject = el('div', 'subject');

    var meta = el('div', 'meta');
    var toLine = el('div', 'meta-line');
    var toText = el('span', 'grow');
    toLine.appendChild(toText);

    var recvLine = el('div', 'meta-line');
    var recvText = el('span', 'grow');
    var warnTag = el('span', 'tag warn');
    warnTag.textContent = 'Unverified sender';
    var mineTag = el('span', 'tag mine push');
    mineTag.textContent = 'yours';
    recvLine.appendChild(recvText); recvLine.appendChild(warnTag); recvLine.appendChild(mineTag);

    meta.appendChild(toLine); meta.appendChild(recvLine);
    head.appendChild(row1); head.appendChild(subject); head.appendChild(meta);

    var body = el('div', 'body');
    body.hidden = true;

    var bar = el('div', 'body-bar');
    var exact = el('span', 'exact');
    bar.appendChild(exact);

    var frame = el('iframe', 'frame');
    frame.setAttribute('sandbox', 'allow-popups allow-popups-to-escape-sandbox');
    frame.setAttribute('referrerpolicy', 'no-referrer');
    frame.setAttribute('title', 'Message body');

    var locked = el('div', 'locked');
    var lockedMark = el('div', 'locked-mark');
    lockedMark.innerHTML = EYE_OFF;   // constant markup, no interpolation
    var lockedLead = el('p', 'locked-lead');
    var lockedHint = el('p', 'locked-hint');
    locked.appendChild(lockedMark); locked.appendChild(lockedLead); locked.appendChild(lockedHint);

    body.appendChild(bar); body.appendChild(frame); body.appendChild(locked);
    node.appendChild(head); node.appendChild(body);

    var card = {
      node: node,
      els: { name: name, addr: addr, when: when, subject: subject,
             toLine: toLine, toText: toText, recvText: recvText,
             warnTag: warnTag, mineTag: mineTag,
             body: body, bar: bar, exact: exact, frame: frame,
             locked: locked, lockedMark: lockedMark,
             lockedLead: lockedLead, lockedHint: lockedHint },
      open: false,
      content: null, denied: false, sent: false, painted: false
    };

    head.onclick = function () { toggleCard(item.id); };

    return card;
  }

  /**
   * Patches an existing card in place. Rebuilding innerHTML would reparent the
   * iframe, which reloads the message body on every unrelated state change.
   */
  function syncCard(item, isNew) {
    var card = cards.get(item.id);
    if (!card) {
      card = buildCard(item);
      cards.set(item.id, card);
      var list = $('list');
      var placeholder = list.querySelector('.empty');
      if (placeholder) list.removeChild(placeholder);
      if (isNew && item.at > connectedAt - 1000) {
        card.node.classList.add('entering', 'fresh');
      }
      // Newest first, and arrivals are monotonic — so new cards prepend and
      // existing nodes are never moved.
      list.insertBefore(card.node, list.firstChild);
    }

    var e = card.els;
    // Everything opens. Mail that is not yours opens onto an explanation of
    // why, and what to do about it, rather than refusing to respond at all.
    card.node.classList.add('openable');

    e.name.textContent = item.fromName || local(item.from);
    e.addr.textContent = item.fromName ? item.from : '';
    e.when.dateTime = new Date(item.at).toISOString();
    e.when.title = new Date(item.at).toLocaleString();
    e.when.textContent = ago(item.at);
    e.subject.textContent = item.subject;
    e.subject.className = 'subject' + (item.masked ? ' masked' : '');

    e.toText.textContent = item.to ? 'to ' + item.to : '';
    e.toLine.hidden = !item.to;

    // Three addresses are in play — the sender above, the address of ours it
    // landed on, and which of us ended up with it. The last decides access.
    e.recvText.textContent = recvLabel(item);
    e.mineTag.hidden = !item.mine;
    e.warnTag.hidden = item.authPass;
  }

  function recvLabel(item) {
    if (item.mine) return 'received by you';
    if (item.owner) return 'received by ' + item.owner;
    if (!item.readable) return 'received by no one · locked';
    var mins = Math.max(1, Math.ceil((item.openUntil - serverNow()) / 60000));
    return 'received by no one · open to everyone for ' + mins + ' more min';
  }

  /**
   * The server re-sends an item when it stops being readable (a public
   * message's window closing). Forget the body, so nothing of it stays in the
   * page, and ask again only if it ever becomes readable.
   */
  function forgetBody(card) {
    card.content = null;
    card.denied = false;
    card.sent = false;
    card.painted = false;
    card.els.frame.removeAttribute('srcdoc');
  }

  function toggleCard(id) {
    if (!items.has(id)) return;
    var card = cards.get(id);
    if (card && card.open) closeCard(id); else openCard(id);
  }

  function openCard(id) {
    var card = cards.get(id);
    var item = items.get(id);
    if (!card || !item) return;
    card.open = true;
    card.node.classList.add('open');
    card.els.body.hidden = false;
    card.node.classList.remove('fresh');
    unread.delete(id);
    paintTitle();
    // No point asking for a body the server would refuse — the client already
    // knows it is not readable, and the explanation is built locally.
    if (item.readable && !card.sent) { card.sent = true; send({ t: 'body', id: id }); }
    paintBody(id);
  }

  function closeCard(id) {
    var card = cards.get(id);
    if (!card) return;
    card.open = false;
    card.node.classList.remove('open');
    card.els.body.hidden = true;
  }

  var DARK = matchMedia('(prefers-color-scheme: dark)');

  function srcdocFor(card) {
    // Remote resources were stripped server-side, so nothing here can phone
    // home. The policy says so a second time anyway.
    var csp = "default-src 'none'; style-src 'unsafe-inline'; font-src data:; img-src data:";
    var dark = DARK.matches;
    return '<!doctype html><meta charset="utf-8">'
      + '<meta http-equiv="Content-Security-Policy" content="' + csp + '">'
      + '<style>html,body{margin:0;padding:14px;background:' + (dark ? '#141D1C' : '#fff')
      + ';color:' + (dark ? '#E6EDEB' : '#121C1A')
      + ';font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;'
      + 'line-height:1.5;word-break:break-word}'
      + 'img{max-width:100%;height:auto}img:not([src]){display:none}'
      + 'table{max-width:100%}a{color:' + (dark ? '#5CC8BC' : '#0C6E66') + '}'
      + '</style>' + card.content.html;
  }

  function showLocked(card, lead, hint, marked) {
    var e = card.els;
    e.bar.hidden = true; e.frame.hidden = true;
    e.locked.hidden = false;
    e.locked.className = 'locked' + (marked ? ' marked' : '');
    e.lockedMark.hidden = !marked;
    e.lockedLead.textContent = lead;
    e.lockedHint.textContent = hint || '';
    e.lockedHint.hidden = !hint;
  }

  /**
   * Someone else's mail. Say who has it and what the reader can actually do —
   * the useful answer is almost always "get your own copy", not "give up".
   */
  function paintLocked(card, item) {
    var role = state ? state.you.role : 'idle';

    if (!item.owner) {
      var again = role === 'holder'
        ? 'You have the mailbox, so trigger the email again and the new one will be yours.'
        : role === 'queued'
          ? 'You are in the queue. Once the mailbox is yours, trigger the email again.'
          : 'Request the mailbox, then trigger the email again — the new one will be yours.';
      showLocked(card, 'Nobody had the mailbox when this arrived, so it was open to everyone for 10 minutes. It is locked now.', again, true);
      return;
    }

    var owner = item.owner;
    var ask = ' Or ask ' + owner + ' to share this one.';

    var hint;
    if (role === 'holder') {
      hint = 'You have the mailbox, so trigger the email again and the new one will be yours.' + ask;
    } else if (role === 'queued') {
      hint = 'You are in the queue. Once the mailbox is yours, trigger the email again.' + ask;
    } else {
      hint = 'Request the mailbox, then trigger the email again — the new one will be yours.' + ask;
    }

    showLocked(card, 'Received by ' + owner + ', so only they can open it.', hint, true);
  }

  function paintBody(id) {
    var card = cards.get(id);
    if (!card || !card.open) return;
    var e = card.els;
    var listed = items.get(id);

    if (listed && !listed.readable) { paintLocked(card, listed); return; }
    if (card.denied) { showLocked(card, 'Not yours to read.', '', true); return; }
    if (!card.content) { showLocked(card, 'Loading…', '', false); return; }

    e.locked.hidden = true;
    e.bar.hidden = false;

    var item = items.get(id);
    // The list shows "5m ago"; an opened message shows exactly when it landed.
    e.exact.textContent = item
      ? new Date(item.at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'medium' })
      : '';

    if (!card.content.html) {
      showLocked(card, '(no content)', '', false);
      return;
    }
    e.frame.hidden = false;
    // Assign srcdoc once; reassigning reloads the frame and loses scroll.
    if (!card.painted) { card.painted = true; e.frame.srcdoc = srcdocFor(card); }
  }

  // ------------------------------------------------------------------ chrome

  function paintCount() {
    var n = items.size;
    $('count').textContent = n ? n + ' of 100' : '';
  }

  function paintTitle() {
    document.title = unread.size ? '(' + unread.size + ') ' + TITLE : TITLE;
  }

  function tickTimes() {
    paintClock();
    cards.forEach(function (card, id) {
      var item = items.get(id);
      if (!item) return;
      card.els.when.textContent = ago(item.at);
      if (!item.owner) card.els.recvText.textContent = recvLabel(item);
    });
  }

  // Signing out is cheap to undo but annoying to do by accident, so it asks.
  var dialog = $('signout-dialog');
  $('signout').onclick = function () { dialog.showModal(); };
  $('signout-cancel').onclick = function () { dialog.close(); };
  // returnTo lands back on this page's root, which then shows the Access
  // login, instead of leaving people on a static "logged out" page.
  $('signout-confirm').onclick = function () {
    location.href = '/cdn-cgi/access/logout?returnTo=' + encodeURIComponent(location.origin + '/');
  };

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { unread.clear(); paintTitle(); }
  });

  // A courtesy that frees the box a few seconds sooner — not a correctness
  // mechanism. The server reacts to the socket closing, however that happens.
  window.addEventListener('pagehide', function () {
    if (ws) try { ws.close(1000, 'pagehide'); } catch (e) {}
  });

  DARK.addEventListener('change', function () {
    cards.forEach(function (card, id) { card.painted = false; paintBody(id); });
  });

  setInterval(tickTimes, 1000);
  paintTitle();
  connect();
})();
</script>
</body>
</html>
